  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- workbench surface -->
  <rect y="230" width="400" height="70" fill="#a1887f"/>
  <rect y="230" width="400" height="8" fill="#8d6e63"/>
  <!-- drill body -->
