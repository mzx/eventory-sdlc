    <rect x="0" y="30" width="150" height="52" rx="10" fill="#2e7d32"/>
    <rect x="150" y="38" width="52" height="36" rx="6" fill="#455a64"/>
    <rect x="202" y="48" width="26" height="16" rx="4" fill="#90a4ae"/>
