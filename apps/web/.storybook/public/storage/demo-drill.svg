    <!-- battery -->
    <rect x="24" y="146" width="64" height="26" rx="6" fill="#37474f"/>
    <!-- trigger -->
    <rect x="76" y="84" width="14" height="24" rx="5" fill="#ffb300"/>
    <!-- vents -->
    <rect x="18" y="42" width="6" height="28" rx="3" fill="#1b5e20"/>
    <rect x="30" y="42" width="6" height="28" rx="3" fill="#1b5e20"/>
