<!doctype html><meta charset="utf-8"><title>Eventory brand</title>
<style>
 body{margin:0;font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;background:#0b2138;color:#e8f2fb}
 .wrap{max-width:1080px;margin:0 auto;padding:40px 32px 80px}

 code{color:#64d2ff}
</style>
