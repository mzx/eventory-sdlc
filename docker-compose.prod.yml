# Single-host production deployment (EVT-19).
#
#   cp .env.prod.example .env.prod   # fill in real values, never commit
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Differences from the dev docker-compose.yml: multi-stage/slim images
# (Dockerfile.prod / Dockerfile.caddy) instead of source-mounted dev
# servers, and Caddy as the single public entrypoint (80/443) terminating
# TLS and reverse-proxying /api + /storage to the api service — the web
# service itself never binds a host port.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-eventory}
    volumes:
      - eventory-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `$$` escapes compose-level interpolation to a literal `$`, so the
      # container's own shell resolves these against the POSTGRES_USER /
      # POSTGRES_DB env vars set above (already defaulted at the compose
      # level, no double-default needed here).
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventory}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eventory}?schema=public
      # Runtime (RLS-restricted) connection — EVT-44, see
      # apps/api/.env.example's longer comment. `eventory_rls`'s password is
      # a placeholder baked into that task's migration SQL by default —
      # operators MUST rotate it (`ALTER ROLE eventory_rls PASSWORD ...`)
      # and set EVENTORY_RLS_PASSWORD in `.env.prod` to match before any
      # real deployment; see docs/operations/tenancy-rls.md.
      APP_DATABASE_URL: postgresql://eventory_rls:${EVENTORY_RLS_PASSWORD:-eventory_rls_change_me}@db:5432/${POSTGRES_DB:-eventory}?schema=public
      PORT: ${PORT:-3001}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      WEB_BASE: ${WEB_BASE:?WEB_BASE must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      EVENTORY_ANTHROPIC_KEY: ${EVENTORY_ANTHROPIC_KEY:-}
      # Sign-in allowlist (EVT-45) — MUST be plumbed through here, not just
      # documented in .env.prod.example, or it silently does nothing on a
      # real deploy (the EVT-20 lesson this task explicitly calls out).
      # Defaults to empty (open self-registration + a startup warning) —
      # see .env.prod.example for why this is the one operators should set.
      EVENTORY_ALLOWED_SIGNINS: ${EVENTORY_ALLOWED_SIGNINS:-}
    volumes:
      - eventory-photo-storage:/workspace/apps/api/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(''http'').get(''http://localhost:3001/api/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # No published host port: Caddy reaches this service over the compose
    # network at api:3001, the API is never exposed directly (AC1).

  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - eventory-caddy-data:/data
      - eventory-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  eventory-db-data:
  # Pinned to the literal name (rather than left to Compose's default
  # `<project>_eventory-photo-storage` prefixing) because scripts/prod-backup.sh
  # and the restore runbook (docs/operations/backups.md) both reach this
  # volume via a bare `docker run -v eventory-photo-storage:...` — a
  # project-unaware command that would otherwise silently create and tar an
  # empty phantom volume every night (EVT-33 review round 2, finding 1).
  # ONE-TIME MIGRATION for the already-deployed VM: see "One-time volume
  # migration (existing VM only)" in docs/operations/backups.md before the
  # next `./deploy.sh` — the data currently lives under the old prefixed
  # name.
  eventory-photo-storage:
    name: eventory-photo-storage
  eventory-caddy-data:
  eventory-caddy-config:
