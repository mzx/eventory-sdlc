services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventory
      POSTGRES_PASSWORD: eventory
      POSTGRES_DB: eventory
    ports:
      - '5432:5432'
    volumes:
      - eventory-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventory -d eventory']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://eventory:eventory@db:5432/eventory?schema=public
      PORT: 3001
      PUBLIC_BASE_URL: https://localhost:5173
    ports:
      - '3001:3001'
    volumes:
      - eventory-photo-storage:/workspace/apps/api/storage
      # mkcert dev certs (EVT-18) — bind-mounted read-only so the container
      # sees whatever the operator generated on the host at apps/api/certs/.
      # Absent/empty on a fresh clone → API falls back to plain HTTP.
      - ./apps/api/certs:/workspace/apps/api/certs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Probes https first, falls back to http — the API serves whichever
      # protocol matches cert presence (see apps/api/healthcheck.js, EVT-18).
      test: ['CMD-SHELL', 'node healthcheck.js']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - '5173:5173'
    volumes:
      # mkcert dev certs (EVT-18) — see apps/api service above.
      - ./apps/web/certs:/workspace/apps/web/certs:ro
    depends_on:
      api:
        condition: service_started

volumes:
  eventory-db-data:
  eventory-photo-storage:
