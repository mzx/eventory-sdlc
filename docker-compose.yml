services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventory
      POSTGRES_PASSWORD: eventory
      POSTGRES_DB: eventory
    ports:
      - '5432:5432'
    volumes:
      - eventory-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventory -d eventory']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://eventory:eventory@db:5432/eventory?schema=public
      PORT: 3001
      PUBLIC_BASE_URL: https://localhost:5173
    ports:
      - '3001:3001'
    volumes:
      - eventory-photo-storage:/workspace/apps/api/storage
      # mkcert dev certs (EVT-18) — bind-mounted read-only so the container
      # sees whatever the operator generated on the host at apps/api/certs/.
      # Absent/empty on a fresh clone → API falls back to plain HTTP.
      - ./apps/api/certs:/workspace/apps/api/certs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Probes https first, falls back to http — the API serves whichever
      # protocol matches cert presence (see apps/api/healthcheck.js, EVT-18).
      test: ['CMD-SHELL', 'node healthcheck.js']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # No VITE_API_PROXY_TARGET here on purpose (EVT-18 review): the api
    # container boots HTTPS-only whenever apps/api/certs/ has both
    # cert.pem + key.pem, so a hardcoded http:// target breaks the
    # /api + /storage dev proxy the moment certs show up. vite.config.ts
    # (resolveApiProxyTarget) picks http vs https at startup by reading the
    # API's own certs directory directly (mounted below) — see the
    # apps/web/certs mount comment. Set VITE_API_PROXY_TARGET here only to
    # force an explicit override (e.g. a non-Docker API host).
    ports:
      - '5173:5173'
    volumes:
      # mkcert dev certs (EVT-18) — see apps/api service above.
      - ./apps/web/certs:/workspace/apps/web/certs:ro
      # The API's OWN certs dir, mounted read-only into the web container
      # too (separately from the api service's own mount above — the two
      # containers don't otherwise share filesystem state). vite.config.ts
      # reads this to decide whether the /api + /storage dev proxy should
      # speak https or http to the api container, since the web side's own
      # cert presence isn't a reliable signal for the API's protocol.
      - ./apps/api/certs:/workspace/apps/api/certs:ro
    depends_on:
      api:
        condition: service_started

volumes:
  eventory-db-data:
  eventory-photo-storage:
