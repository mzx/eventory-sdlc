services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventory
      POSTGRES_PASSWORD: eventory
      POSTGRES_DB: eventory
    ports:
      - '5432:5432'
    volumes:
      - eventory-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventory -d eventory']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://eventory:eventory@db:5432/eventory?schema=public
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(''http'').get(''http://localhost:3001/api/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_started

volumes:
  eventory-db-data:
