services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventory
      POSTGRES_PASSWORD: eventory
      POSTGRES_DB: eventory
    ports:
      - '5432:5432'
    volumes:
      - eventory-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventory -d eventory']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Dev container stops at `build` (not `runtime`): that stage already
      # has devDependencies (@nestjs/cli, for `start:dev` below) AND a
      # generated Prisma client (its `pnpm run build` step runs
      # `prisma generate && nest build` — we don't need the `nest build`
      # output, but we do need the generated client that comes bundled
      # with it) — see the node_modules volumes below (EVT-21).
      target: build
    restart: unless-stopped
    working_dir: /workspace/apps/api
    environment:
      DATABASE_URL: postgresql://eventory:eventory@db:5432/eventory?schema=public
      PORT: 3001
      PUBLIC_BASE_URL: https://localhost:5173
      # Secrets interpolated from the gitignored root .env file (empty
      # defaults keep the stack bootable on a fresh clone without one).
      EVENTORY_ANTHROPIC_KEY: ${EVENTORY_ANTHROPIC_KEY:-}
      EVENTORY_ANTHROPIC_MODEL: ${EVENTORY_ANTHROPIC_MODEL:-}
      EVENTORY_ADMIN_EMAILS: ${EVENTORY_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      JWT_SECRET: ${JWT_SECRET:-}
      WEB_BASE: ${WEB_BASE:-http://localhost:5173}
    ports:
      - '3001:3001'
    volumes:
      - eventory-photo-storage:/workspace/apps/api/storage
      # Live dev source (EVT-21): bind-mount the workspace source + root
      # manifests so `nest start --watch` (below) picks up host edits with
      # no image rebuild. node_modules is deliberately NOT part of this
      # bind — it stays on the named volumes below so the image's
      # pnpm-installed tree (native bindings for prisma/sharp built for
      # *this* container, plus the generated Prisma client) isn't shadowed
      # by whatever is (or isn't) in the equivalent host directory.
      - ./apps:/workspace/apps
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - eventory-api-root-node-modules:/workspace/node_modules
      - eventory-api-node-modules:/workspace/apps/api/node_modules
      # mkcert dev certs (EVT-18) — bind-mounted read-only so the container
      # sees whatever the operator generated on the host at apps/api/certs/.
      # Absent/empty on a fresh clone → API falls back to plain HTTP. Nested
      # under the broader ./apps bind above; listed after it so this more
      # specific (read-only) mount wins for this one path.
      - ./apps/api/certs:/workspace/apps/api/certs:ro
    # Starts the real Nest watch server (`start:dev`, not the baked
    # `dist/main.js`) so edits under the bind mount above hot-restart the
    # process. Before that, in order:
    #   1. if pnpm-lock.yaml changed since this node_modules volume was last
    #      populated (hash stamped into the volume itself), reinstall
    #      automatically; a failed install fails loudly instead of silently
    #      running against a stale/missing dependency tree (EVT-21 AC2).
    #   2. `prisma generate` — the source is bind-mounted (EVT-21) but the
    #      generated Prisma client lives in the node_modules volume, so a
    #      schema change pulled from git (new model/field) leaves the client
    #      stale until this runs (EVT-32).
    #   3. `prisma migrate deploy` — applies any migrations merged from git
    #      that haven't been applied to this dev database yet (EVT-1's
    #      original design; EVT-32 makes it actually happen on every start,
    #      not just image builds). Deploy only, never `migrate dev` — dev
    #      containers must never create migrations.
    # Each step logs a distinct success/failure line so `docker compose logs
    # api` shows exactly which stage ran; `set -e` plus the explicit
    # `exit 1` guards mean a failure here keeps the container
    # restarting/unhealthy (never half-running with a stale client or an
    # unmigrated schema) — see apps/api/healthcheck.js, which only reports
    # healthy once the app is actually serving requests.
    command:
      - sh
      - -c
      - |
        set -e
        HASH_FILE=/workspace/apps/api/node_modules/.pnpm-lock.sha256
        NEW_HASH=$$(sha256sum /workspace/pnpm-lock.yaml | cut -d' ' -f1)
        if [ ! -f "$$HASH_FILE" ] || [ "$$(cat "$$HASH_FILE")" != "$$NEW_HASH" ]; then
          echo "[dev] pnpm-lock.yaml changed - reinstalling api dependencies..."
          if ! pnpm install --frozen-lockfile --filter=@eventory/api...; then
            echo "[dev] ERROR: pnpm install failed for @eventory/api - fix pnpm-lock.yaml/package.json, then restart this container (docker compose restart api)." >&2
            exit 1
          fi
          echo "$$NEW_HASH" > "$$HASH_FILE"
        fi
        echo "[dev] running prisma generate..."
        if ! pnpm --filter=@eventory/api run prisma:generate; then
          echo "[dev] ERROR: prisma generate failed - fix apps/api/prisma/schema.prisma, then restart this container (docker compose restart api)." >&2
          exit 1
        fi
        echo "[dev] prisma generate complete."
        echo "[dev] running prisma migrate deploy..."
        if ! pnpm --filter=@eventory/api run prisma:migrate:deploy; then
          echo "[dev] ERROR: prisma migrate deploy failed - check the failing migration under apps/api/prisma/migrations, fix it, then restart this container (docker compose restart api)." >&2
          exit 1
        fi
        echo "[dev] prisma migrate deploy complete - no pending migrations."
        exec pnpm --filter=@eventory/api run start:dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Probes https first, falls back to http — the API serves whichever
      # protocol matches cert presence (see apps/api/healthcheck.js, EVT-18).
      test: ['CMD-SHELL', 'node healthcheck.js']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # No VITE_API_PROXY_TARGET here on purpose (EVT-18 review): the api
    # container boots HTTPS-only whenever apps/api/certs/ has both
    # cert.pem + key.pem, so a hardcoded http:// target breaks the
    # /api + /storage dev proxy the moment certs show up. vite.config.ts
    # (resolveApiProxyTarget) picks http vs https at startup by reading the
    # API's own certs directory directly (mounted below) — see the
    # apps/web/certs mount comment. Set VITE_API_PROXY_TARGET here only to
    # force an explicit override (e.g. a non-Docker API host).
    ports:
      - '5173:5173'
    volumes:
      # Live dev source (EVT-21): bind-mount the workspace source + root
      # manifests so Vite's dev server (with HMR) picks up host edits with
      # no image rebuild. node_modules stays on the named volumes below,
      # off the bind — see the api service's node_modules comment above for
      # why.
      - ./apps:/workspace/apps
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - eventory-web-root-node-modules:/workspace/node_modules
      - eventory-web-node-modules:/workspace/apps/web/node_modules
      # mkcert dev certs (EVT-18) — see apps/api service above. Nested under
      # the broader ./apps bind above; listed after it so this more
      # specific (read-only) mount wins for this one path.
      - ./apps/web/certs:/workspace/apps/web/certs:ro
      # The API's OWN certs dir, mounted read-only into the web container
      # too (separately from the api service's own mount above — the two
      # containers don't otherwise share filesystem state). vite.config.ts
      # reads this to decide whether the /api + /storage dev proxy should
      # speak https or http to the api container, since the web side's own
      # cert presence isn't a reliable signal for the API's protocol.
      - ./apps/api/certs:/workspace/apps/api/certs:ro
    # Same auto-reinstall-or-fail-loudly contract as the api service above
    # (EVT-21 AC2), then starts the real `vite --host 0.0.0.0` dev server
    # (apps/web/package.json's `dev` script) so HMR picks up the bind
    # mount above.
    command:
      - sh
      - -c
      - |
        set -e
        HASH_FILE=/workspace/apps/web/node_modules/.pnpm-lock.sha256
        NEW_HASH=$$(sha256sum /workspace/pnpm-lock.yaml | cut -d' ' -f1)
        if [ ! -f "$$HASH_FILE" ] || [ "$$(cat "$$HASH_FILE")" != "$$NEW_HASH" ]; then
          echo "[dev] pnpm-lock.yaml changed - reinstalling web dependencies..."
          if ! pnpm install --frozen-lockfile --filter=@eventory/web...; then
            echo "[dev] ERROR: pnpm install failed for @eventory/web - fix pnpm-lock.yaml/package.json, then restart this container (docker compose restart web)." >&2
            exit 1
          fi
          echo "$$NEW_HASH" > "$$HASH_FILE"
        fi
        exec pnpm run dev
    depends_on:
      api:
        condition: service_started

volumes:
  eventory-db-data:
  # node_modules for the dev containers (EVT-21) — deliberately named (not
  # anonymous) so they survive `docker compose down` / restarts and are
  # easy to find with `docker volume ls`. One pair per service: each
  # service's image installs a different --filter subset, so their
  # node_modules trees (root-hoisted AND the package-local one) differ.
  # `docker compose down -v` clears them, forcing a full reinstall on next
  # `up` — the same escape hatch as deleting node_modules locally.
  eventory-api-root-node-modules:
  eventory-api-node-modules:
  eventory-web-root-node-modules:
  eventory-web-node-modules:
  eventory-photo-storage:
